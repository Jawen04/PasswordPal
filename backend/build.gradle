plugins {
    id 'application'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

application {
    mainClass = 'restserver.BackendApplication' // Ensure this is the correct class path
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // For JPA
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'      // For JDBC
    implementation 'org.springframework.boot:spring-boot-starter-web'       // For web features
    // implementation 'org.springframework.boot:spring-boot-starter-security'  // For security
    implementation 'org.springframework:spring-webmvc'                      // For MVC

    testImplementation 'org.springframework.boot:spring-boot-starter-test'  // For testing
    implementation 'mysql:mysql-connector-java:8.0.33' // Or latest
    implementation 'org.springframework.security:spring-security-crypto:6.1.5' // BCrypt


}



bootRun {
    mainClass = 'restserver.BackendApplication'  // Ensure this is the correct class
}

