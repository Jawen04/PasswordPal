<html>

<head>
  <title>Backend for PasswordPal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="message">Loading...</div>

  <script>
    fetch("http://localhost:8080/auth/testSQL")
      .then(response => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(data => {
        document.getElementById("message").textContent = "Data loaded successfully.";
        // You can optionally hide the message or replace it with other content here
      })
      .catch(error => {
        console.error("Error fetching data:", error);
        document.getElementById("message").textContent = "Failed to load data.";
      });
  </script>
</body>

</html>
