version: '3.8'

services:
  frontend:
    environment:
      - VITE_API_URL=http://backend:8080
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net  # Reference to network

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE=5
      - SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT=30000 

      - ADMIN_DASHBOARD_PASSWORD=${ADMIN_DASHBOARD_PASSWORD}

    ports:
      - "8080:8080"
    networks:
      - app_net  # Reference to network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      # - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - app_net  # Reference to network

volumes:
  mysql_data:

# THIS IS THE MISSING SECTION THAT FIXES THE ERROR
networks:
  app_net:
    driver: bridge